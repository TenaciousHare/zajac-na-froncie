name: Scheduled rebuild

on:
  schedule:
    - cron: "17 5 * * *" # codziennie o 05:17 UTC (07:17 w PL latem)
  workflow_dispatch: # pozwala odpalić ręcznie z zakładki Actions

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        run: curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
