name: Scheduled rebuild

on:
  schedule:
    - cron: "0 5 * * *" # codziennie o 05:00 UTC (07:00 w PL latem)
  workflow_dispatch: # pozwala odpalić ręcznie z zakładki Actions

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        run: curl -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
